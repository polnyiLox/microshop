name: microshop

x-postgres-healthcheck: &postgres-healthcheck
  interval: 5s
  timeout: 5s
  retries: 20
  start_period: 5s

x-api-healthcheck: &api-healthcheck
  test:
    - CMD
    - python
    - -c
    - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 15s

x-python-service: &python-service
  restart: unless-stopped
  init: true
  networks:
    - backend

x-rabbitmq-environment: &rabbitmq-environment
  APP_CONFIG__RABBITMQ__USER: microservices
  APP_CONFIG__RABBITMQ__PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
  APP_CONFIG__RABBITMQ__HOST: rabbitmq
  APP_CONFIG__RABBITMQ__PORT: "5672"

x-kafka-environment: &kafka-environment
  APP_CONFIG__KAFKA__BOOTSTRAP_SERVERS: kafka:29092
  APP_CONFIG__KAFKA__ACKS: all

services:
  auth-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: microshop
      POSTGRES_PASSWORD: ${MICROSHOP_DB_PASSWORD:?Set MICROSHOP_DB_PASSWORD in .env}
      POSTGRES_DB: auth_service_db
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck
      test: [CMD-SHELL, "pg_isready -U microshop -d auth_service_db"]
    networks: [backend]

  catalog-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: microshop
      POSTGRES_PASSWORD: ${MICROSHOP_DB_PASSWORD:?Set MICROSHOP_DB_PASSWORD in .env}
      POSTGRES_DB: catalog_service_db
    volumes:
      - catalog_db_data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck
      test: [CMD-SHELL, "pg_isready -U microshop -d catalog_service_db"]
    networks: [backend]

  order-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: microshop
      POSTGRES_PASSWORD: ${MICROSHOP_DB_PASSWORD:?Set MICROSHOP_DB_PASSWORD in .env}
      POSTGRES_DB: order_service_db
    volumes:
      - order_db_data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck
      test: [CMD-SHELL, "pg_isready -U microshop -d order_service_db"]
    networks: [backend]

  payment-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: microshop
      POSTGRES_PASSWORD: ${MICROSHOP_DB_PASSWORD:?Set MICROSHOP_DB_PASSWORD in .env}
      POSTGRES_DB: payment_service_db
    volumes:
      - payment_db_data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck
      test: [CMD-SHELL, "pg_isready -U microshop -d payment_service_db"]
    networks: [backend]

  notification-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: microshop
      POSTGRES_PASSWORD: ${MICROSHOP_DB_PASSWORD:?Set MICROSHOP_DB_PASSWORD in .env}
      POSTGRES_DB: notification_service_db
    volumes:
      - notification_db_data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck
      test: [CMD-SHELL, "pg_isready -U microshop -d notification_service_db"]
    networks: [backend]

  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: microshop
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:?Set MONGODB_PASSWORD in .env}
      MONGO_INITDB_DATABASE: analytics_service_db
    volumes:
      - analytics_db_data:/data/db
    healthcheck:
      test: [CMD-SHELL, "mongosh --quiet --username microshop --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [backend]

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: microservices
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks: [backend]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?Set MINIO_PASSWORD in .env}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks: [backend]

  prometheus:
    image: prom/prometheus:v3.11.3
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      catalog-service:
        condition: service_healthy
    ports:
      - "9090:9090"
    networks: [backend]

  loki:
    image: grafana/loki:3.7.4
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks: [backend]

  alloy:
    image: grafana/alloy:v1.18.0
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - loki
    ports:
      - "12345:12345"
    networks: [backend]

  grafana:
    image: grafana/grafana:13.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD in .env}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    ports:
      - "3001:3000"
    networks:
      - frontend
      - backend

  kafka:
    image: apache/kafka:4.3.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [backend]

  auth-migrate:
    build: ./auth-service
    environment: &auth-environment
      APP_CONFIG__DB__USER: microshop
      APP_CONFIG__DB__PASSWORD: ${MICROSHOP_DB_PASSWORD:?Set MICROSHOP_DB_PASSWORD in .env}
      APP_CONFIG__DB__HOST: auth-db
      APP_CONFIG__DB__PORT: "5432"
      APP_CONFIG__DB__NAME: auth_service_db
      APP_CONFIG__API__V1_PREFIX: /v1
      APP_CONFIG__API__HOST: 0.0.0.0
      APP_CONFIG__API__PORT: "8000"
      APP_CONFIG__API__RELOAD: "false"
      APP_CONFIG__JWT_AUTH__PRIVATE_KEY_PATH: certs/jwt-private.pem
      APP_CONFIG__JWT_AUTH__PUBLIC_KEY_PATH: certs/jwt-public.pem
      APP_CONFIG__JWT_AUTH__ALGORITHM: RS256
      APP_CONFIG__JWT_AUTH__ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      APP_CONFIG__JWT_AUTH__REFRESH_TOKEN_EXPIRE_DAYS: "7"
      APP_CONFIG__REFRESH_TOKEN_COOKIES__KEY: refresh_token
      APP_CONFIG__REFRESH_TOKEN_COOKIES__SECURE: "false"
      APP_CONFIG__REFRESH_TOKEN_COOKIES__HTTPONLY: "true"
      APP_CONFIG__REFRESH_TOKEN_COOKIES__SAME_SITE: lax
      APP_CONFIG__INTERNAL_API__TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN in .env}
      APP_CONFIG__REDIS__HOST: redis
      APP_CONFIG__REDIS__PORT: "6379"
      APP_CONFIG__REDIS__DB: "0"
      APP_CONFIG__REDIS__PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      APP_CONFIG__REDIS__TTL_SECONDS: "60"
      APP_CONFIG__REDIS__KEY_PREFIX: auth
      APP_CONFIG__REDIS__BALANCE_KEY: "balance:"
    command: [alembic, upgrade, head]
    volumes:
      - ./auth-service/certs:/app/certs:ro
    depends_on:
      auth-db:
        condition: service_healthy
    restart: "no"
    networks: [backend]

  auth-service:
    <<: *python-service
    build: ./auth-service
    environment: *auth-environment
    volumes:
      - ./auth-service/certs:/app/certs:ro
    depends_on:
      auth-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck: *api-healthcheck

  catalog-migrate:
    build: ./catalog-service
    environment: &catalog-environment
      APP_CONFIG__DB__USER: microshop
      APP_CONFIG__DB__PASSWORD: ${MICROSHOP_DB_PASSWORD:?Set MICROSHOP_DB_PASSWORD in .env}
      APP_CONFIG__DB__HOST: catalog-db
      APP_CONFIG__DB__PORT: "5432"
      APP_CONFIG__DB__NAME: catalog_service_db
      APP_CONFIG__API__V1_PREFIX: /v1
      APP_CONFIG__API__HOST: 0.0.0.0
      APP_CONFIG__API__PORT: "8000"
      APP_CONFIG__API__RELOAD: "false"
      <<: *rabbitmq-environment
      APP_CONFIG__RABBITMQ__VHOST: /
      APP_CONFIG__REDIS__HOST: redis
      APP_CONFIG__REDIS__PORT: "6379"
      APP_CONFIG__REDIS__DB: "0"
      APP_CONFIG__REDIS__PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      APP_CONFIG__REDIS__TTL_SECONDS: "60"
      APP_CONFIG__REDIS__KEY_PREFIX: catalog
      APP_CONFIG__S3__ACCESS_KEY: minio
      APP_CONFIG__S3__SECRET_KEY: ${MINIO_PASSWORD:?Set MINIO_PASSWORD in .env}
      APP_CONFIG__S3__ENDPOINT_URL: http://minio:9000
      APP_CONFIG__S3__PUBLIC_ENDPOINT_URL: http://localhost:9000
      APP_CONFIG__S3__SERVICE_NAME: s3
      APP_CONFIG__S3__REGION_NAME: us-east-1
      APP_CONFIG__S3__BUCKET_NAME: catalog-images
      APP_CONFIG__S3__PRESIGNED_URL_EXPIRE_SECONDS: "3600"
    command: [alembic, upgrade, head]
    depends_on:
      catalog-db:
        condition: service_healthy
    restart: "no"
    networks: [backend]

  catalog-service:
    <<: *python-service
    build: ./catalog-service
    environment: *catalog-environment
    depends_on:
      catalog-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck: *api-healthcheck

  order-migrate:
    build: ./order-service
    environment: &order-environment
      APP_CONFIG__DB__USER: microshop
      APP_CONFIG__DB__PASSWORD: ${MICROSHOP_DB_PASSWORD:?Set MICROSHOP_DB_PASSWORD in .env}
      APP_CONFIG__DB__HOST: order-db
      APP_CONFIG__DB__PORT: "5432"
      APP_CONFIG__DB__NAME: order_service_db
      APP_CONFIG__API__V1_PREFIX: /v1
      APP_CONFIG__API__HOST: 0.0.0.0
      APP_CONFIG__API__PORT: "8000"
      APP_CONFIG__API__RELOAD: "false"
      APP_CONFIG__CATALOG_CLIENT__BASE_URL: http://catalog-service:8000/v1
      <<: [*rabbitmq-environment, *kafka-environment]
      APP_CONFIG__KAFKA__CLIENT_ID: order-service
      APP_CONFIG__ANALYTICS_TOPICS__ORDER_EVENTS_TOPIC: order.analytics.events
      APP_CONFIG__REDIS__HOST: redis
      APP_CONFIG__REDIS__PORT: "6379"
      APP_CONFIG__REDIS__DB: "0"
      APP_CONFIG__REDIS__PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      APP_CONFIG__REDIS__TTL_SECONDS: "60"
      APP_CONFIG__REDIS__KEY_PREFIX: order
      APP_CONFIG__REDIS__USER_ORDERS_KEY: "user:"
      APP_CONFIG__REDIS__SELLER_ORDERS_KEY: "seller:"
      APP_CONFIG__REDIS__ORDER_ITEMS_KEY: ":items:"
    command: [alembic, upgrade, head]
    depends_on:
      order-db:
        condition: service_healthy
    restart: "no"
    networks: [backend]

  order-service:
    <<: *python-service
    build: ./order-service
    environment: *order-environment
    depends_on:
      order-migrate:
        condition: service_completed_successfully
      catalog-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck: *api-healthcheck

  payment-migrate:
    build: ./payment-service
    environment: &payment-environment
      APP_CONFIG__DB__USER: microshop
      APP_CONFIG__DB__PASSWORD: ${MICROSHOP_DB_PASSWORD:?Set MICROSHOP_DB_PASSWORD in .env}
      APP_CONFIG__DB__HOST: payment-db
      APP_CONFIG__DB__PORT: "5432"
      APP_CONFIG__DB__NAME: payment_service_db
      APP_CONFIG__API__V1_PREFIX: /v1
      APP_CONFIG__API__HOST: 0.0.0.0
      APP_CONFIG__API__PORT: "8000"
      APP_CONFIG__API__RELOAD: "false"
      <<: [*rabbitmq-environment, *kafka-environment]
      APP_CONFIG__RABBITMQ__VHOST: /
      APP_CONFIG__KAFKA__CLIENT_ID: payment-service
      APP_CONFIG__ANALYTICS_TOPICS__PAYMENT_EVENTS_TOPIC: payment.analytics.events
      APP_CONFIG__AUTH_CLIENT__BASE_URL: http://auth-service:8000/v1/internal
      APP_CONFIG__AUTH_CLIENT__INTERNAL_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN in .env}
      APP_CONFIG__REDIS__HOST: redis
      APP_CONFIG__REDIS__PORT: "6379"
      APP_CONFIG__REDIS__DB: "0"
      APP_CONFIG__REDIS__PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      APP_CONFIG__REDIS__TTL_SECONDS: "60"
      APP_CONFIG__REDIS__KEY_PREFIX: payment
      APP_CONFIG__REDIS__PAYMENT_KEY: "payment:"
      APP_CONFIG__REDIS__ORDER_PAYMENTS_KEY: "order:"
      APP_CONFIG__REDIS__USER_PAYMENTS_KEY: "user:"
    command: [alembic, upgrade, head]
    depends_on:
      payment-db:
        condition: service_healthy
    restart: "no"
    networks: [backend]

  payment-service:
    <<: *python-service
    build: ./payment-service
    environment: *payment-environment
    depends_on:
      payment-migrate:
        condition: service_completed_successfully
      auth-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck: *api-healthcheck

  notification-migrate:
    build: ./notification-service
    environment: &notification-environment
      APP_CONFIG__DB__USER: microshop
      APP_CONFIG__DB__PASSWORD: ${MICROSHOP_DB_PASSWORD:?Set MICROSHOP_DB_PASSWORD in .env}
      APP_CONFIG__DB__HOST: notification-db
      APP_CONFIG__DB__PORT: "5432"
      APP_CONFIG__DB__NAME: notification_service_db
      APP_CONFIG__API__V1_PREFIX: /v1
      APP_CONFIG__API__HOST: 0.0.0.0
      APP_CONFIG__API__PORT: "8000"
      APP_CONFIG__API__RELOAD: "false"
      <<: *rabbitmq-environment
      APP_CONFIG__RABBITMQ__VHOST: /
      APP_CONFIG__REDIS__HOST: redis
      APP_CONFIG__REDIS__PORT: "6379"
      APP_CONFIG__REDIS__DB: "0"
      APP_CONFIG__REDIS__PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      APP_CONFIG__REDIS__TTL_SECONDS: "60"
      APP_CONFIG__REDIS__KEY_PREFIX: notification
      APP_CONFIG__REDIS__USER_NOTIFICATIONS_KEY: "user:"
    command: [alembic, upgrade, head]
    depends_on:
      notification-db:
        condition: service_healthy
    restart: "no"
    networks: [backend]

  notification-service:
    <<: *python-service
    build: ./notification-service
    environment: *notification-environment
    depends_on:
      notification-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck: *api-healthcheck

  analytics-service:
    <<: *python-service
    build: ./analytics-service
    environment:
      APP_CONFIG__MONGODB__USER: microshop
      APP_CONFIG__MONGODB__PASSWORD: ${MONGODB_PASSWORD:?Set MONGODB_PASSWORD in .env}
      APP_CONFIG__MONGODB__HOST: mongodb
      APP_CONFIG__MONGODB__PORT: "27017"
      APP_CONFIG__MONGODB__NAME: analytics_service_db
      APP_CONFIG__MONGODB__AUTH_SOURCE: admin
      APP_CONFIG__API__V1_PREFIX: /v1
      APP_CONFIG__API__HOST: 0.0.0.0
      APP_CONFIG__API__PORT: "8000"
      APP_CONFIG__API__RELOAD: "false"
      APP_CONFIG__KAFKA__BOOTSTRAP_SERVERS: kafka:29092
      APP_CONFIG__KAFKA__CLIENT_ID: analytics-service
      APP_CONFIG__KAFKA__GROUP_ID: analytics-service
      APP_CONFIG__KAFKA__AUTO_OFFSET_RESET: earliest
      APP_CONFIG__KAFKA__ENABLE_AUTO_COMMIT: "false"
      APP_CONFIG__ANALYTICS_TOPICS__ORDER_EVENTS_TOPIC: order.analytics.events
      APP_CONFIG__ANALYTICS_TOPICS__PAYMENT_EVENTS_TOPIC: payment.analytics.events
      APP_CONFIG__REDIS__HOST: redis
      APP_CONFIG__REDIS__PORT: "6379"
      APP_CONFIG__REDIS__DB: "0"
      APP_CONFIG__REDIS__PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      APP_CONFIG__REDIS__TTL_SECONDS: "60"
      APP_CONFIG__REDIS__KEY_PREFIX: analytics
      APP_CONFIG__REDIS__OVERVIEW_KEY: overview
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck: *api-healthcheck

  api-gateway:
    <<: *python-service
    build: ./api-gateway
    environment:
      APP_CONFIG__API__HOST: 0.0.0.0
      APP_CONFIG__API__PORT: "8080"
      APP_CONFIG__API__RELOAD: "false"
      APP_CONFIG__API__V1_PREFIX: /v1
      APP_CONFIG__MIDDLEWARE__ALLOW_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
      APP_CONFIG__MIDDLEWARE__ALLOW_METHODS: '["*"]'
      APP_CONFIG__MIDDLEWARE__ALLOW_HEADERS: '["*"]'
      APP_CONFIG__MIDDLEWARE__ALLOW_CREDENTIALS: "true"
      APP_CONFIG__SERVICES__AUTH_URL: http://auth-service:8000
      APP_CONFIG__SERVICES__CATALOG_URL: http://catalog-service:8000
      APP_CONFIG__SERVICES__ORDER_URL: http://order-service:8000
      APP_CONFIG__SERVICES__PAYMENT_URL: http://payment-service:8000
      APP_CONFIG__SERVICES__NOTIFICATION_URL: http://notification-service:8000
      APP_CONFIG__SERVICES__ANALYTICS_URL: http://analytics-service:8000
      APP_CONFIG__JWT__PUBLIC_KEY_PATH: certs/jwt-public.pem
      APP_CONFIG__JWT__ALGORITHM: RS256
      APP_CONFIG__HTTP_CLIENT__TIMEOUT_SECONDS: "10"
    depends_on:
      auth-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - frontend
      - backend

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${FRONTEND_API_URL:-http://localhost:8080/v1}
        NEXT_PUBLIC_SITE_URL: ${FRONTEND_SITE_URL:-http://localhost:3000}
    restart: unless-stopped
    init: true
    environment:
      PORT: "3000"
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - frontend
      - backend

networks:
  frontend:
  backend:
    internal: true

volumes:
  auth_db_data:
  catalog_db_data:
  order_db_data:
  payment_db_data:
  notification_db_data:
  analytics_db_data:
  rabbitmq_data:
  kafka_data:
  minio_data:
  prometheus_data:
  loki_data:
  alloy_data:
  grafana_data:
