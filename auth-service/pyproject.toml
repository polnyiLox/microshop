[project]
name = "auth-service"
version = "0.1.0"
description = "Authentication and authorization service for MicroShop"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "phonenumbers>=9.0.37",
    "prometheus-client>=0.26.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.4",
    "pyjwt[crypto]>=2.13.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "testcontainers>=4.15.0",
]
