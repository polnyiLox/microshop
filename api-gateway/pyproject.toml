[project]
name = "api-gateway"
version = "0.1.0"
description = "API Gateway for the microservices application"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "prometheus-client>=0.26.0",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.13.0",
    "uvicorn>=0.52.3",
    "websockets>=16.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
