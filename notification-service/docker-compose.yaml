services:

  postgres:
    image: postgres:17

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    expose:
      - "5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s


  migrate:
    build:
      context: .
      dockerfile: Dockerfile

    env_file:
      - .env

    command:
      - alembic
      - upgrade
      - head

    depends_on:
      postgres:
        condition: service_healthy


  api:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "${APP_CONFIG__API__PORT:-8000}:8000"

    depends_on:
      migrate:
        condition: service_completed_successfully

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    stop_grace_period: 30s


volumes:
  postgres_data: