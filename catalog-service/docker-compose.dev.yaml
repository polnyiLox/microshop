services:

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev

    env_file:
      - .env

    ports:
      - "${APP_CONFIG__API__PORT:-8000}:8000"

    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini

    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy


  postgres:
    image: postgres:17

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.dev

    env_file:
      - .env

    command:
      - uv
      - run
      - alembic
      - upgrade
      - head

    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini

    depends_on:
      postgres:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4-management

    environment:
      RABBITMQ_DEFAULT_USER: ${APP_CONFIG__RABBITMQ__USER}
      RABBITMQ_DEFAULT_PASS: ${APP_CONFIG__RABBITMQ__PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${APP_CONFIG__RABBITMQ__VHOST}

    ports:
      - "5672:5672"
      - "15672:15672"

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine

    environment:
      REDIS_PASSWORD: ${APP_CONFIG__REDIS__PASSWORD}

    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest

    environment:
      MINIO_ROOT_USER: ${APP_CONFIG__S3__ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${APP_CONFIG__S3__SECRET_KEY}

    command: server /data --console-address ":9001"

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_dev_data:/data

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10


volumes:
  postgres_dev_data:
  minio_dev_data:
