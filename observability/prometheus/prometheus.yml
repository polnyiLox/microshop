global:
  scrape_interval: 15s

scrape_configs:
  - job_name: catalog-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - catalog-service:8000

  - job_name: auth-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - auth-service:8000

  - job_name: order-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - order-service:8000

  - job_name: payment-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - payment-service:8000

  - job_name: notification-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - notification-service:8000

  - job_name: analytics-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - analytics-service:8000

  - job_name: api-gateway
    metrics_path: /metrics
    static_configs:
      - targets:
          - api-gateway:8080
