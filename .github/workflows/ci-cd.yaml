name: MicroShop CI/CD

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: microshop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - catalog-service
          - order-service
          - payment-service
          - notification-service
          - analytics-service
          - api-gateway
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          cache-dependency-glob: ${{ matrix.service }}/uv.lock
      - name: Install dependencies
        run: uv sync --frozen --dev
        working-directory: ${{ matrix.service }}
      - name: Run test suite
        run: uv run pytest -q
        working-directory: ${{ matrix.service }}

  frontend-checks:
    name: Check frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Build application
        run: npm run build

  compose-check:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Validate production configuration
        run: docker compose --env-file .env.example -f docker-compose.yaml config --quiet
      - name: Validate development configuration
        run: docker compose --env-file .env.example -f docker-compose.yaml -f docker-compose.dev.yaml config --quiet

  publish-images:
    name: Publish ${{ matrix.service }} image
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [backend-tests, frontend-checks, compose-check]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - catalog-service
          - order-service
          - payment-service
          - notification-service
          - analytics-service
          - api-gateway
          - frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/microshop-${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
